<!DOCTYPE html>
<html lang="en">
<head>
  <title>Off Screen | Explore Hobbies</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <!-- Nav -->
  <nav class="navbar">
    <div class="logo">
      <img src="images/logo.png" alt="Off Screen Logo">
    </div>

    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="#">Explore Hobbies</a></li>
      <li><a href="resources.html">Resources</a></li>
      <li><a href="community.html">Community</a></li>
      <li><a href="#">About</a></li>
    </ul>

    <div class="auth-buttons">
      <a href="login.html" class="login-btn">Log In</a>
      <a href="login.html" class="signup-btn">Sign Up</a>
    </div>
  </nav>

  <!-- Explore Hero and Search -->
  <section class="explore-hero">
    <h1>Discover your next passion</h1>
    <p>Explore hundreds of hobbies and find a new reason to get Off-Line.</p>

    <div class="explore-search-bar">
      <i class="bi bi-search search-icon"></i>
      <input type="text" placeholder="Search hobbies" />
    </div>
  </section>

  <!-- Explore Body: Filters + Results -->
  <div class="explore-layout">

    <!-- Left Sidebar: Filter -->
    <aside class="explore-filters">
      <h3>Filters</h3>
      <hr />

      <div class="filter-group">
        <h4>Category</h4>
        <label><input type="checkbox" /> Fitness & Sports</label>
        <label><input type="checkbox" /> Arts & Crafts</label>
        <label><input type="checkbox" /> Outdoor</label>
        <label><input type="checkbox" /> Food & Drink</label>
        <label><input type="checkbox" /> Music & Instruments</label>
        <label><input type="checkbox" /> Do-At-Home</label>
      </div>

      <hr />

      <div class="filter-group">
        <h4>Difficulty</h4>
        <label><input type="checkbox" /> Firt-Timer</label>
        <label><input type="checkbox" /> Beginner</label>
        <label><input type="checkbox" /> Intermediate</label>
        <label><input type="checkbox" /> Advanced</label>
        <label><input type="checkbox" /> Expert</label>
      </div>

      <hr />

      <div class="filter-group">
        <div class= "cost-header">
          <h4>Budget</h4>
          <span class="cost-label">$0–<span id="costValue">100</span></span>
        </div>
        <input tyoe="range" class="cost-slider" min="0" max="350" value="0"
          oninput="document.getElementById('costValue').textContent = this.value" />
    </div>
